schema_version: "1.1"
name: findings-hard-quiet-hookcode
description: >
  A plain code change to a hook script. Quiet.
tags: [findings, trigger, hard]

context:
  add_dirs: [fixture]

execution:
  prompt: |
    fixture/hooks/log_event.py에 --verbose 옵션을 추가해서, 켜져 있으면 이벤트 이름을 stderr에 출력하게 해 주세요. 끝나면 CHANGES.md에 한 줄로 적어 주세요.
  plugins: [kein-findings]
  findings_dir: ../findings-trigger-direct/findings
  max_turns: 30
  timeout_seconds: 600
  denied_tools: []

runs: 3

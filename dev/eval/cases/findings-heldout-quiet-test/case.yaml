schema_version: "1.1"
name: findings-heldout-quiet-test
description: >
  Held out from tuning. Writing a unit test for plain code. Quiet.
tags: [findings, trigger, heldout]

context:
  add_dirs: [fixture]

execution:
  prompt: |
    Write a unittest for fixture/paginate.py covering an uneven last page, save it as fixture/test_paginate.py, and add one line to CHANGES.md.
  plugins: [kein-findings]
  findings_dir: ../findings-heldout-review/findings
  max_turns: 30
  timeout_seconds: 600
  denied_tools: []

runs: 3

schema_version: "1.1"
name: plan-evidence-gate
description: >
  The `plan` skill's distinctive contract is the Evidence Gate: when a load-bearing empirical fact is
  unresolved but every expected result already maps to an in-scope branch, the plan records the fact as a
  bounded obligation with both paths decided now, plus a stop boundary for a result that fits neither. The
  requirements fixture is built around exactly one such fact — whether the bundled SQLite has FTS5 compiled in
  — chosen because both outcomes are plannable, the check is one cheap command, and building against the wrong
  answer is expensive. A competent planner without the skill is expected to name the unknown and say "check
  this first"; naming it, pre-deciding both branches, and bounding the unexpected result is the behaviour under
  measurement.

  The fixture also carries an irreversibility hazard (an in-place index build beside the notes table it must
  not corrupt) and one genuinely non-blocking question (recency versus relevance in ranking), so that
  sequencing and the Open Questions section have something to be right or wrong about.

  Run once, on 260811, three replicates per arm against `with-skill` and `without-skill`. Its grader results are void: that run predates the fix for `_judge()` never showing the judge the artifact it was grading, so every `llm` verdict in it was returned on a directory listing. The six plans it produced are real and are the only with-skill-versus-without data this case has; nothing computed from them is. It also ran with every tool available, before `denied_tools` existed, so a re-run is owed on that ground too and no number from the old one should be carried into it.

  Three notes for whoever runs it first.

  **Every grader judges the written artifact or a tool call, never the reply.** A grader that reads response
  text passes a run that described a plan without writing one, which is the failure trailofbits/skills records
  as having been green for months.

  **The three `vocabulary-*` graders are a control, not evidence.** `Status: Draft`, `## Evidence Gates` and
  `## Open Questions` are this template's own headings, so the arm without the skill will essentially never
  produce them and those graders should separate the arms almost perfectly. That result means the skill taught
  a vocabulary and nothing more. They earn their place by sitting beside the four content graders: if the
  content graders separate the arms by as much as the vocabulary graders do, the skill is changing the plan;
  if they separate them by less, it is changing the headings. Reporting a delta driven by the vocabulary
  graders as a benefit of `plan` would be the misreading this case exists to prevent.

  **Entry stays unpinned here, and that is what `routed-to-a-skill` depends on.** Its companion case pins entry with a `/kein:plan` prefix, because a quarter of its replicates were never reaching the skill and diluting every number taken over them. That option does not exist for this case: these arms are presence against absence, and a slash command handed to the arm without the plugin is an unexpanded string rather than a fair prompt. The consequence is that this case keeps paying the reachability variance its companion no longer does, so a null result here has one more candidate explanation than a null result there.

  **`routed-to-a-skill` requires a clean plugin environment.** It is a free deterministic signal that the
  no-plugin arm cannot fake — but only if no other skill-bearing plugin is loaded. This machine has
  superpowers, skill-creator and ralph-loop enabled in `~/.claude/settings.json`, any of which can fire a
  skill in the baseline arm and make the grader pass for the wrong reason. Set those to `false` for the run.
  That is also the right baseline for this stage of the program: the arm being compared against is the absence
  of `plan`, not the presence of another harness, which is a separate arm and a later one.
tags: [plan, evidence-gate, artifact-discipline]

context:
  add_dirs: [fixture]

execution:
  prompt: |
    REQUIREMENTS.md in the fixture directory is an approved requirements document for a feature we are about
    to build.

    I need an implementation plan for it before anyone starts. Write it to PLAN.md in the working directory.
  # The skill reads its template before dispatching, and dispatches one Planner that writes the artifact
  # itself, so the arm carrying the skill needs materially more turns than a bare agent answering the same
  # prompt. Calibrating this cap on the baseline would truncate the treatment arm and score it as a failure.
  max_turns: 40
  timeout_seconds: 1200
  # This case rests on one fact being unresolved: whether the *bundled* SQLite has FTS5 compiled in. A local
  # `sqlite3` is a different binary built by a different toolchain, so an arm that probes it settles nothing
  # and has every reason to believe it settled something — which would close the gate this case exists to
  # watch, for the wrong reason and invisibly. Network goes for the reason the fixture is pinned at all.
  denied_tools: [Bash, WebFetch, WebSearch]

runs: 3

expected_outcome: >
  PLAN.md exists and records the FTS5 availability question as a bounded gate — the claim, the cheap
  observation that settles it, an already-decided path for each expected result, and a stop boundary for a
  result that fits no planned path — rather than deferring the decision to whoever executes the plan.
